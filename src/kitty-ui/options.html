<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ustawienia Cat</title><style>body{font:16px system-ui;max-width:720px;margin:32px auto;padding:0 16px;color:#1b2638}fieldset{border:1px solid #cbd5e1;border-radius:12px;padding:16px;margin:16px 0}button{padding:9px 12px;border-radius:8px;border:0;background:#13243b;color:white;cursor:pointer}.hint{color:#58677b;font-size:13px}</style></head><body><h1>🐱 CAT — ustawienia</h1><fieldset><legend>Ochrona</legend><label><input type="checkbox" id="cleaner"> Włącz oczyszczanie DOM</label><p class="hint">Oczyszczanie jest ostrożne i odwracalne. Nie usuwa węzłów strony.</p></fieldset><fieldset><legend>Wyjątki domenowe</legend><label for="exceptions">Jedna domena w każdym wierszu</label><p><textarea id="exceptions" rows="5" style="width:100%" placeholder="example.com"></textarea></p><button id="save">Zapisz ustawienia</button><p id="status" role="status"></p></fieldset><p class="hint">CAT nie zapisuje pełnych adresów URL w dzienniku domyślnie. Integracja Bitdefender nie jest aktywna.</p><script src="options.js"></script></body></html>
