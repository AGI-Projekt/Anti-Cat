name: CAT CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build both browser profiles
        run: python build_extension.py all
      - name: Python tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript syntax checks
        shell: bash
        run: |
          node --check src/background/service-worker.js
          node --check src/detector/detector.js
          node --check src/cleaner/cleaner.js
          node --check src/kitty-ui/options.js
          node --check src/kitty-ui/popup.js
      - name: Runtime contract tests
        run: node tests/test_runtime_contracts.js
      - name: Release Gate
        run: python release_gate.py
