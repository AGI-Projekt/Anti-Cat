name: CAT CI
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build extension profiles
        run: python build_extension.py all
      - name: Python tests
        run: python -m unittest discover -s tests -v
      - name: Runtime contracts
        run: node tests/test_runtime_contracts.js
      - name: JavaScript syntax
        run: node --check src/background/service-worker.js && node --check src/detector/detector.js && node --check src/cleaner/cleaner.js
