<!doctype html>
<html lang="pl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CAT Browser Regression Fixture</title>
<style>body{font:16px system-ui;max-width:760px;margin:2rem auto;padding:0 1rem}nav a{margin-right:1rem}.ad-slot{border:2px dashed #987;padding:1rem;margin:1rem 0}.content{padding:1rem;background:#f2f4f8}label,input,button{display:block;margin:.5rem 0;padding:.5rem}</style></head>
<body>
<header><h1>Strona testowa CAT</h1><nav aria-label="Nawigacja"><a href="#article">Artykuł</a><a href="#form">Formularz</a></nav></header>
<aside class="ad-slot" data-ad-slot="true" aria-label="Przykładowy kontener reklamowy"><strong>Kontener testowy reklamy</strong><p>To element kontrolny, nie prawdziwa reklama.</p></aside>
<main><article id="article" class="content"><h2>Treść artykułu</h2><p id="article-copy">Ten tekst musi pozostać widoczny po uruchomieniu CAT.</p><p>Test regresji sprawdza zachowanie podstawowej treści i nawigacji.</p></article>
<section id="form"><h2>Formularz testowy</h2><form id="login-form"><label for="email">Adres testowy</label><input id="email" type="email" required value="tester@example.invalid"><label for="message">Wiadomość</label><input id="message" value="test"><button type="submit">Sprawdź formularz</button><output id="form-result" aria-live="polite"></output></form></section>
<section><h2>Multimedia</h2><video controls width="320" aria-label="Kontrolka wideo testowa"></video><audio controls aria-label="Kontrolka audio testowa"></audio></section></main>
<script>document.getElementById('login-form').addEventListener('submit',e=>{e.preventDefault();document.getElementById('form-result').textContent='FORM_OK'});</script>
</body></html>
