<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><title>CAT regression fixture</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:16px system-ui;max-width:760px;margin:2rem auto;padding:0 1rem}nav,article,form,section{border:1px solid #ccd3dd;border-radius:8px;padding:1rem;margin:1rem 0}.ad-slot{min-height:50px;background:#fff0cc;padding:1rem}</style></head><body><nav><a href="#article">Nawigacja testowa</a></nav><main><article id="article"><h1>Artykuł testowy</h1><p>Treść strony musi pozostać widoczna.</p></article><section class="ad-slot" data-ad-slot="fixture-banner">Kontrolowany kontener reklamowy</section><form id="fixture-form"><label>Test formularza <input name="q" required value="ok"></label><button>Wyślij</button></form><p id="result" aria-live="polite"></p><video controls aria-label="Test wideo"></video><script>document.getElementById('fixture-form').addEventListener('submit',e=>{e.preventDefault();document.getElementById('result').textContent='FORM_OK'});</script></main></body></html>
